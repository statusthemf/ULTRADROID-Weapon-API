name: Weapon 7 Test Build

'on':
push: {}
pull_request: {}
workflow_dispatch: {}

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '10.0.x'

  - name: Build Weapon7Test
    run: dotnet build examples/Weapon7Test/Weapon7Test.csproj --configuration Release
