name: Build ULTRADROID Weapon 7 Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify required DLL files
        shell: bash
        run: |
          set -eu

          files=(
            "lib/BepInEx.Core.dll"
            "lib/BepInEx.Unity.IL2CPP.dll"
            "lib/Il2CppInterop.Runtime.dll"
            "lib/Il2Cppmscorlib.dll"
            "lib/Assembly-CSharp.dll"
            "lib/UnityEngine.CoreModule.dll"
          )

          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty DLL: $file"
              exit 1
            fi
            echo "Found $file"
          done

      - name: Build Weapon7Test
        run: dotnet build examples/Weapon7Test/Weapon7Test.csproj --configuration Release

      - name: Upload test mod
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID-Weapon7Test
          path: examples/Weapon7Test/bin/Release/**/*.dll
          if-no-files-found: error
