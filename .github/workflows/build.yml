name: Build ULTRADROID Weapon API

on:
push:
pull_request:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: 10.0.x

  - name: Restore projects
    run: |
      dotnet restore src/ULTRADROID.Weapon.API/ULTRADROID.Weapon.API.csproj
      dotnet restore core/ULTRADROID.Weapon.Core/ULTRADROID.Weapon.Core.csproj
      dotnet restore examples/Weapon7Test/Weapon7Test.csproj

  - name: Build API
    run: dotnet build src/ULTRADROID.Weapon.API/ULTRADROID.Weapon.API.csproj --configuration Release --no-restore

  - name: Build Core
    run: dotnet build core/ULTRADROID.Weapon.Core/ULTRADROID.Weapon.Core.csproj --configuration Release --no-restore

  - name: Build Weapon7Test
    run: dotnet build examples/Weapon7Test/Weapon7Test.csproj --configuration Release --no-restore
