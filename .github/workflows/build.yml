name: Build ULTRADROID Weapon API

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify required DLL files
        shell: bash
        run: |
          set -eu

          required=(
            "lib/ULTRADROID.API.dll"
            "lib/BepInEx.Core.dll"
            "lib/BepInEx.Unity.IL2CPP.dll"
            "lib/Il2CppInterop.Runtime.dll"
            "lib/Il2Cppmscorlib.dll"
            "lib/Assembly-CSharp.dll"
            "lib/UnityEngine.CoreModule.dll"
            "lib/Unity.TextMeshPro.dll"
          )

          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty DLL: $file"
              exit 1
            fi
            echo "Found $file"
          done

      - name: Restore Weapon API
        run: dotnet restore src/ULTRADROID.Weapon.API/ULTRADROID.Weapon.API.csproj

      - name: Build Weapon API
        run: dotnet build src/ULTRADROID.Weapon.API/ULTRADROID.Weapon.API.csproj --configuration Release --no-restore

      - name: Upload Weapon API
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID-Weapon-API
          path: src/ULTRADROID.Weapon.API/bin/Release/net10.0/ULTRADROID.Weapon.API.dll
          if-no-files-found: error
